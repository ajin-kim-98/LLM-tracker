<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윈터딜</title>
<meta name="description" content="뽐뿌 핫딜과 Google 뉴스에서 모은 유니클로, 노스페이스, 무신사, 패딩 할인 소식">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --primary: #287A74;
    --primary-hover: #1F625D;
    --on-primary: #ffffff;
    --accent-line: #55A9A0;
    --highlight: #AEEED3;
    --badge: #FFF8B0;
    --background: #ffffff;
    --surface: #f5f5f7;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: #d2d2d7;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Helvetica Neue", Arial, sans-serif;
    --content: 980px;
    color-scheme: light;
  }
  @media (max-width: 1068px) { :root { --content: 692px; } }
  @media (max-width: 734px)  { :root { --content: 87.5%; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--background);
    color: var(--text);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.53;
    letter-spacing: 0;
    word-break: keep-all;      /* 한글을 단어 단위로 줄바꿈 */
    overflow-wrap: anywhere;   /* 긴 영문/URL은 넘치지 않게 */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  .wrap { width: var(--content); max-width: 980px; margin: 0 auto; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; }

  /* Header */
  header { border-bottom: 1px solid var(--border); }
  header .wrap {
    min-height: 56px;
    display: flex; flex-wrap: wrap; align-items: baseline;
    column-gap: 16px; row-gap: 0;
    padding-block: 12px;
  }
  .site-name { margin: 0; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .tagline { margin: 0; font-size: 15px; line-height: 1.4; color: var(--text-secondary); }

  main { flex: 1; padding-block: 24px 48px; }

  /* Keyword chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    height: 36px; padding: 0 16px;
    border: 0; border-radius: 980px;
    background: var(--surface); color: var(--text);
    font-size: 15px; font-weight: 600; line-height: 1.4;
    cursor: pointer;
  }
  .chip:hover { box-shadow: inset 0 0 0 1px var(--border); }
  .chip .count { margin-left: 4px; font-weight: 400; color: var(--text-secondary); }
  .chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
  .chip[aria-pressed="true"]:hover { background: var(--primary-hover); box-shadow: none; }
  .chip[aria-pressed="true"] .count { color: var(--on-primary); }
  .chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* Featured */
  .featured {
    background: var(--highlight);
    border-radius: 12px;
    border-left: 4px solid var(--accent-line);
    padding: 32px;
    color: var(--text);
  }
  .featured .meta { margin-top: 0; color: var(--text); }
  .featured-title { margin: 8px 0 0; font-size: 32px; font-weight: 700; line-height: 1.25; }
  .featured-price { margin: 16px 0 0; font-size: 28px; font-weight: 700; line-height: 1.2; }
  .button {
    display: inline-block; margin-top: 24px;
    background: var(--primary); color: var(--on-primary);
    border-radius: 980px; padding: 12px 22px;
    font-size: 17px; line-height: 1.53;
  }
  .button:hover { background: var(--primary-hover); text-decoration: none; }

  /* List grouped by day */
  .group-title { margin: 48px 0 16px; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .group-title + .list { margin-bottom: 0; }
  .group-title .count { margin-left: 8px; font-size: 15px; font-weight: 400; color: var(--text-secondary); }
  .list ~ .group-title { margin-top: 32px; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .item {
    display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
    padding-block: 16px;
    border-bottom: 1px solid var(--border);
  }
  .item-title { font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--text); }
  .item-body { min-width: 0; }
  .meta { margin-top: 4px; font-size: 15px; line-height: 1.4; color: var(--text-secondary); }
  .price { flex-shrink: 0; font-size: 17px; font-weight: 700; line-height: 1.4; color: var(--primary); }
  .badge {
    display: inline-block; margin-right: 8px;
    background: var(--badge); color: var(--text);
    border-radius: 8px; padding: 0 4px;
    font-size: 15px; font-weight: 600; line-height: 1.4;
  }

  .notice { color: var(--text-secondary); }

  /* AI 판단 (선택 기능) */
  .ai-bar {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 8px 16px; margin-bottom: 24px;
  }
  .ai-status { margin: 0; font-size: 15px; line-height: 1.4; color: var(--text-secondary); }
  .ai-status:empty { display: none; }
  .ai-actions { display: flex; flex-wrap: wrap; gap: 16px; margin-left: auto; }
  .text-button {
    padding: 0; border: 0; background: none; cursor: pointer;
    font-size: 17px; line-height: 1.53; color: var(--primary);
  }
  .text-button:hover { color: var(--primary-hover); text-decoration: underline; }
  .text-button:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 4px; }
  .reason { margin: 4px 0 0; font-size: 15px; line-height: 1.4; color: var(--text-secondary); }
  .featured .reason { margin-top: 8px; color: var(--text); }

  footer { background: var(--surface); color: var(--text-secondary); font-size: 15px; line-height: 1.4; }
  footer .wrap { padding-block: 24px; }
  footer p { margin: 0; }
  footer p + p { margin-top: 4px; }

  @media (max-width: 734px) {
    .featured { padding: 24px; }
    .featured-title { font-size: 26px; }
    .featured-price { font-size: 24px; }
    .item { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="site-name">윈터딜</h1>
    <p class="tagline" id="tagline">뽐뿌 핫딜과 Google 뉴스에서 모은 겨울옷 할인 소식</p>
  </div>
</header>

<main class="wrap" id="main">
  <p class="notice">할인 소식을 불러오는 중입니다.</p>
</main>

<footer>
  <div class="wrap">
    <p>15분마다 뽐뿌 핫딜과 Google 뉴스에서 새 글을 모읍니다. 가격과 할인율은 글 제목에 적힌 값만 보여줍니다.</p>
    <p>AI 판단은 이 브라우저 안의 Chrome 내장 AI로만 실행되고, 결과는 이 기기에만 저장됩니다.</p>
    <p id="updated"></p>
  </div>
</footer>

<!-- Chrome 내장 AI 연결: 번역(translator-ko.js)을 먼저, 언어 모델(ai.js)을 다음에 -->
<script src="js/translator-ko.js"></script>
<script src="js/ai.js"></script>
<script>
(function () {
  var TZ = "Asia/Seoul";
  var DAY_MS = 24 * 60 * 60 * 1000;

  var dateFmt = new Intl.DateTimeFormat("ko-KR", {
    timeZone: TZ, month: "long", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
  });
  var dayFmt = new Intl.DateTimeFormat("ko-KR", { timeZone: TZ, month: "long", day: "numeric" });
  var ymdFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function safeLink(url) {
    return /^https?:\/\//i.test(url || "") ? url : "#";
  }

  function link(cls, text, url) {
    var a = el("a", cls, text);
    a.href = safeLink(url);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }

  function when(iso) {
    if (!iso) return "게시 시각 정보 없음";
    return dateFmt.format(new Date(iso));
  }

  /* "방금 · 12분 전 · 3시간 전", 하루가 지나면 "11월 24일" */
  function ago(iso) {
    if (!iso) return "게시 시각 정보 없음";
    var diff = Date.now() - new Date(iso).getTime();
    if (diff < 60 * 1000) return "방금";
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + "분 전";
    if (diff < DAY_MS) return Math.floor(diff / 3600000) + "시간 전";
    return dayFmt.format(new Date(iso));
  }

  /* 한국 시간 기준 날짜 묶음: 오늘 / 어제 / 이번 주 / 지난 소식 */
  function dayGroup(iso) {
    if (!iso) return "지난 소식";
    var day = Date.parse(ymdFmt.format(new Date(iso)));
    var today = Date.parse(ymdFmt.format(new Date()));
    var diff = Math.round((today - day) / DAY_MS);
    if (diff <= 0) return "오늘";
    if (diff === 1) return "어제";
    if (diff < 7) return "이번 주";
    return "지난 소식";
  }
  var GROUP_ORDER = ["오늘", "어제", "이번 주", "지난 소식"];

  function metaText(item) {
    var parts = [item.source];
    if (item.shop) parts.push(item.shop);
    parts.push(ago(item.published_at));
    return parts.join(" · ");
  }

  /* 오른쪽 숫자: 가격 → 없으면 할인율 → 둘 다 없으면 비움 (지어내지 않는다) */
  function headline(item) { return item.price || item.discount || ""; }

  function itemKeywords(item) {
    if (Array.isArray(item.keywords) && item.keywords.length) return item.keywords;
    var kws = (view.data && view.data.keywords) || [];
    return kws.filter(function (k) { return item.title.toLowerCase().indexOf(k.toLowerCase()) !== -1; });
  }

  function renderFeatured(item) {
    var box = el("section", "featured");
    box.setAttribute("aria-label", "지금 눈여겨볼 할인 소식");
    var meta = el("div", "meta");
    if (item.kind === "hotdeal") meta.appendChild(el("span", "badge", "핫딜"));
    meta.appendChild(document.createTextNode(metaText(item)));
    box.appendChild(meta);
    box.appendChild(el("h2", "featured-title", item.title));
    if (headline(item)) box.appendChild(el("p", "featured-price", headline(item)));
    var j = judgment(item);
    if (j && j.reason) box.appendChild(el("p", "reason", "AI 판단: " + j.reason));
    box.appendChild(link("button", "원문 보기", item.link));
    return box;
  }

  function renderItem(item) {
    var li = el("li", "item");
    var body = el("div", "item-body");
    body.appendChild(link("item-title", item.title, item.link));
    var meta = el("div", "meta");
    if (item.kind === "hotdeal") meta.appendChild(el("span", "badge", "핫딜"));
    meta.appendChild(document.createTextNode(metaText(item)));
    meta.title = when(item.published_at);
    body.appendChild(meta);
    var j = judgment(item);
    if (j && j.reason) body.appendChild(el("div", "reason", "AI 판단: " + j.reason));
    li.appendChild(body);
    if (headline(item)) li.appendChild(el("span", "price", headline(item)));
    return li;
  }

  /* ───────── 상태 ───────── */
  var AI_STORE = "winterdeal:ai:v1";
  var FILTER_STORE = "winterdeal:filter:v1";
  var AI_OK = !!(window.AI && AI.isSupported() && window.KoTranslate && KoTranslate.isSupported());
  var ai = loadAi();                       // { on, key, cache: { link: { relevant, reason } } }
  var filter = loadFilter();               // "" = 전체, 아니면 키워드
  var view = { data: null, judging: false, msg: "", error: "", done: 0, total: 0 };

  function loadAi() {
    try {
      var s = JSON.parse(localStorage.getItem(AI_STORE));
      if (s && s.cache) return s;
    } catch (e) {}
    return { on: false, key: "", cache: {} };
  }
  function saveAi() {
    try { localStorage.setItem(AI_STORE, JSON.stringify(ai)); } catch (e) {}
  }
  function loadFilter() {
    try { return localStorage.getItem(FILTER_STORE) || ""; } catch (e) { return ""; }
  }
  function setFilter(k) {
    filter = k;
    try { localStorage.setItem(FILTER_STORE, k); } catch (e) {}
    render();
  }

  function sortedItems() {
    return ((view.data && view.data.items) || []).slice().sort(function (a, b) {
      return (b.published_at || "").localeCompare(a.published_at || "");
    });
  }
  function judgment(item) { return ai.on ? ai.cache[item.link] : null; }
  function isHidden(item) { var j = judgment(item); return !!j && j.relevant === false; }
  function pendingItems() { return sortedItems().filter(function (i) { return !(i.link in ai.cache); }); }

  /* ───────── AI 판단 (Chrome 내장 AI, 선택 기능) ─────────
   * 제목(한국어) → KoTranslate.toEnglish → AI.ask(ai/prompt.md + ai/schema.json) → reason만 한국어로.
   * 판단 결과는 이 브라우저의 localStorage에만 저장한다 (서버로 보내지 않음).
   */
  async function runAi() {
    if (view.judging) return;
    // 모델 다운로드는 클릭 직후, 어떤 await보다 먼저 시작해야 허용된다.
    var onProgress = function (loaded) {
      view.msg = "AI 모델을 받고 있어요 " + Math.round((loaded || 0) * 100) + "%";
      render();
    };
    var ready = Promise.all([AI.prepare(onProgress), KoTranslate.prepare(onProgress)]);

    var key = (view.data.keywords || []).join("|");
    if (ai.key !== key) { ai.cache = {}; ai.key = key; }   // 키워드가 바뀌면 이전 판단은 버린다
    ai.on = true;
    var pending = pendingItems();
    if (!pending.length) { ready.catch(function () {}); saveAi(); render(); return; }

    view.judging = true; view.error = ""; view.done = 0; view.total = pending.length;
    view.msg = "AI 모델을 준비하고 있어요";
    render();
    try {
      await ready;
      var prompt = await AI.loadPrompt("ai/prompt.md");
      var schema = await AI.loadSchema("ai/schema.json");
      var session = await AI.createSession(prompt);
      for (var i = 0; i < pending.length; i++) {
        var item = pending[i];
        view.msg = "AI가 확인하고 있어요 " + (i + 1) + " / " + pending.length;
        render();
        try {
          var en = await KoTranslate.toEnglish(item.title);
          var answer = await AI.ask(session, en, schema);
          var ko = await KoTranslate.fieldsToKorean(answer, ["reason"]);
          ai.cache[item.link] = { relevant: ko.relevant === true, reason: ko.reason || "" };
        } catch (err) {
          console.warn("판단하지 못한 글:", item.title, err);   // 이 글은 판단 없이 그대로 보여준다
        }
        view.done = i + 1;
      }
      if (session.destroy) session.destroy();
    } catch (err) {
      console.error(err);
      ai.on = false;
      view.error = (err && err.message) || "AI 판단 중 문제가 생겼습니다.";
    }
    view.judging = false; view.msg = "";
    saveAi();
    render();
  }

  function textButton(label, onClick) {
    var b = el("button", "text-button", label);
    b.type = "button";
    b.addEventListener("click", onClick);
    return b;
  }

  function renderAiBar(hiddenCount) {
    var bar = el("div", "ai-bar");
    var status = el("p", "ai-status");
    status.setAttribute("role", "status");
    var actions = el("div", "ai-actions");

    if (!AI_OK) {
      status.textContent = "데스크톱 Chrome(148 이상)에서 열면 AI로 겨울옷 할인 글만 골라볼 수 있습니다.";
    } else if (view.judging) {
      status.textContent = view.msg;
    } else {
      if (view.error) {
        status.textContent = "AI 판단을 하지 못했습니다: " + view.error;
      } else if (ai.on) {
        status.textContent = hiddenCount
          ? "AI가 겨울옷 할인이 아닌 글 " + hiddenCount + "건을 숨겼습니다."
          : "AI가 확인한 결과 숨길 글이 없습니다.";
      }
      var pending = pendingItems().length;
      if (!ai.on) {
        actions.appendChild(textButton("AI로 겨울옷 할인만 보기", runAi));
      } else {
        if (pending) actions.appendChild(textButton("새 글 " + pending + "건 AI로 확인하기", runAi));
        actions.appendChild(textButton("모든 글 보기", function () { ai.on = false; view.error = ""; saveAi(); render(); }));
      }
    }
    bar.appendChild(status);
    bar.appendChild(actions);
    return bar;
  }

  function renderChips(visible) {
    var wrap = el("div", "chips");
    wrap.setAttribute("role", "group");
    wrap.setAttribute("aria-label", "키워드로 걸러 보기");
    var kws = (view.data && view.data.keywords) || [];
    var options = [{ key: "", label: "전체", count: visible.length }].concat(kws.map(function (k) {
      return { key: k, label: k, count: visible.filter(function (i) { return itemKeywords(i).indexOf(k) !== -1; }).length };
    }));
    options.forEach(function (o) {
      var b = el("button", "chip", o.label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(filter === o.key));
      b.appendChild(el("span", "count", String(o.count)));
      b.addEventListener("click", function () { setFilter(filter === o.key ? "" : o.key); });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function render() {
    var data = view.data;
    var main = document.getElementById("main");
    main.textContent = "";
    var all = sortedItems();

    if (data.keywords && data.keywords.length) {
      document.getElementById("tagline").textContent =
        "뽐뿌 핫딜과 Google 뉴스에서 모은 " + data.keywords.join(", ") + " 할인 소식";
      if (filter && data.keywords.indexOf(filter) === -1) filter = "";   // 사라진 키워드면 전체로
    }
    if (data.updated_at) {
      document.getElementById("updated").textContent = "마지막 수집: " + when(data.updated_at);
    }

    if (!all.length) {
      main.appendChild(el("p", "notice", "아직 키워드에 맞는 할인 소식이 없습니다. 15분 뒤에 다시 확인해 주세요."));
      return;
    }

    var visible = all.filter(function (i) { return !isHidden(i); });
    main.appendChild(renderChips(visible));
    main.appendChild(renderAiBar(all.length - visible.length));

    var items = filter ? visible.filter(function (i) { return itemKeywords(i).indexOf(filter) !== -1; }) : visible;
    if (!items.length) {
      main.appendChild(el("p", "notice", filter
        ? filter + " 할인 소식이 아직 없습니다. 15분마다 새로 모읍니다."
        : "AI 기준으로 남은 겨울옷 할인 소식이 없습니다."));
      return;
    }

    // featured: 가격이나 할인율이 적힌 가장 최근 글. 없으면 가장 최근 글.
    var featured = items.filter(function (i) { return headline(i); })[0] || items[0];
    main.appendChild(renderFeatured(featured));

    var rest = items.filter(function (i) { return i !== featured; });
    var groups = {};
    rest.forEach(function (i) { var g = dayGroup(i.published_at); (groups[g] = groups[g] || []).push(i); });
    GROUP_ORDER.forEach(function (g) {
      if (!groups[g]) return;
      var h = el("h2", "group-title", g);
      h.appendChild(el("span", "count", groups[g].length + "건"));
      main.appendChild(h);
      var ul = el("ul", "list");
      groups[g].forEach(function (item) { ul.appendChild(renderItem(item)); });
      main.appendChild(ul);
    });
  }

  fetch("deals.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      view.data = data;
      // 지금 목록에 없는 글의 판단은 지워서 저장 공간이 계속 늘지 않게 한다.
      var links = {};
      (data.items || []).forEach(function (i) { links[i.link] = true; });
      Object.keys(ai.cache).forEach(function (l) { if (!links[l]) delete ai.cache[l]; });
      saveAi();
      render();
      // "n분 전" 표시가 낡지 않게 1분마다 다시 그린다 (판단 중에는 건너뜀).
      setInterval(function () { if (!view.judging) render(); }, 60 * 1000);
    })
    .catch(function () {
      var main = document.getElementById("main");
      main.textContent = "";
