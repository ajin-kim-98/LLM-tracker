name: collect-and-deploy

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 (GitHub 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: winterdeal
  cancel-in-progress: false

jobs:
  # 1) 수집하고 사이트 파일을 artifact로 올린다.
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Collect
        run: python scripts/collect.py

      - name: Commit deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/deals.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: update deals.json"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # 2) 올린 artifact를 GitHub Pages에 배포한다. (같은 job에서는 artifact를 못 찾음)
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
